# fly.toml app configuration file generated for quarrystar-online on 2025-08-07T17:09:25-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quarrystar-online'
primary_region = 'atl'

[[mounts]]
  source = "data"
  destination = "/data"

[build]



[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = "5s"
    timeout = "2s"
    grace_period = "30s"   # give your app time to init DB
    method = "GET"
    path = "/healthz"      # <— use the cheap, DB-ready check
    protocol = "http"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
